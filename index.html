
<!DOCTYPE html>
<html>
<head>
    <title>Khan Website</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7ff;
            color: #222;
        }

        nav {
            background: #111b4d;
            padding: 18px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-size: 18px;
            font-weight: bold;
        }

        .hero {
            text-align: center;
            padding: 60px 20px;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
        }

        .hero h1 {
            font-size: 42px;
        }

        .hero p {
            font-size: 20px;
        }

        .hero img {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            margin: 20px;
            border: 5px solid white;
        }

        button {
            background: orange;
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
        }

        section {
            padding: 50px 20px;
            text-align: center;
        }

        section h2 {
            color: #1e3c72;
            font-size: 32px;
        }

        .skills {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .skill-card {
            background: white;
            width: 180px;
            padding: 30px 15px;
            border-radius: 15px;
            border: 3px solid orange;
            box-shadow: 0 5px 15px #ccc;
            font-size: 20px;
            font-weight: bold;
        }

        input, textarea {
            width: 85%;
            max-width: 500px;
            padding: 14px;
            margin: 7px;
            border: 2px solid #1e3c72;
            border-radius: 8px;
            font-size: 16px;
        }

        textarea {
            height: 120px;
        }

        footer {
            background: #111b4d;
            color: white;
            text-align: center;
            padding: 25px;
        }
    </style>
</head>

<body>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <div class="hero" id="home">
        <h1>Assalam-o-Alaikum! 👋</h1>
        <p>Welcome to my website.</p>
        <p>My name is Khan. I am learning web development.</p>

        <img src="https://picsum.photos/300" alt="My Image">

        <br>

        <button onclick="location.href='#about'">
            Learn More
        </button>
    </div>

    <section id="about">
        <h2>About Me</h2>
        <p>My name is Khan. I am learning web development.</p>

        <h3>My Skills</h3>

        <div class="skills">
            <div class="skill-card">💻 HTML</div>
            <div class="skill-card">🎨 CSS</div>
            <div class="skill-card">⚡ JavaScript</div>
        </div>
    </section>

    <section id="contact">
        <h2>Contact Me</h2>

        <input type="text" id="name" placeholder="Your Name">
        <br>

        <input type="email" id="email" placeholder="Your Email">
        <br>

        <textarea id="message" placeholder="Your Message"></textarea>
        <br>

        <button onclick="sendMessage()">Send Message</button>
    </section>

    <footer>
        © 2026 Khan | All Rights Reserved
    </footer>

    <script>
        function sendMessage() {
            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let message = document.getElementById("message").value;

            if (name == "" || email == "" || message == "") {
                alert("Please fill all fields!");
            } else {
                alert("Message sent successfully!");
            }
        }
    </script>

</body>
</html>
