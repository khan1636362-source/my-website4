<!DOCTYPE html>
<html>
<head>
    <title>Khan Website</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7ff;
            color: #222;
        }

        nav {
            background: #111b4d;
            padding: 18px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-size: 18px;
            font-weight: bold;
        }

        .hero {
            text-align: center;
            padding: 60px 20px;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
        }

        .hero h1 {
            font-size: 42px;
        }

        .hero p {
            font-size: 20px;
        }

        .hero img {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            margin: 20px;
            border: 5px solid white;
        }

        button {
            background: orange;
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
        }

        section {
            padding: 50px 20px;
            text-align: center;
        }

        section h2 {
            color: #1e3c72;
            font-size: 32px;
        }

        .skills {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .skill-card {
            background: white;
            width: 180px;
            padding: 30px 15px;
            border-radius: 15px;
            border: 3px solid orange;
            box-shadow: 0 5px 15px #ccc;
            font-size: 20px;
            font-weight: bold;
            transition: 0.3s;
        }

        .skill-card:hover {
            transform: scale(1.08);
        }

        input, textarea {
            width: 85%;
            max-width: 500px;
            padding: 14px;
            margin: 7px;
            border: 2px solid #1e3c72;
            border-radius: 8px;
            font-size: 16px;
        }

        textarea {
            height: 120px;
        }

        footer {
            background: #111b4d;
            color: white;
            text-align: center;
            padding: 25px;
            margin-top: 30px;
        }

                font-size: 30px;
